# Publishes a Foundry release whenever main receives a module.json version that has no release yet:
# sets the version and URLs in module.json, zips the module, creates the tag vX.Y.Z and the
# GitHub release with module.json + hunt-showdown-fco.zip attached.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(jq -r .version module.json)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version and URLs in module.json
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          REPO="${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" \
             --arg url "https://github.com/$REPO" \
             --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg download "https://github.com/$REPO/releases/download/v$VERSION/hunt-showdown-fco.zip" \
             '.version=$v | .url=$url | .manifest=$manifest | .download=$download' \
             module.json > module.tmp && mv module.tmp module.json

      - name: Build the zip
        if: steps.check.outputs.exists == 'false'
        run: zip -r hunt-showdown-fco.zip module.json README.md CHANGELOG.md assets data lang scripts styles

      - name: Publish the release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: |
            module.json
            hunt-showdown-fco.zip
          body_path: CHANGELOG.md
